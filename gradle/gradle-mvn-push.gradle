apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'nu.studer.credentials'

android {
    compileSdk 35

    // ✅ singleVariant belongs HERE, inside the android block
    publishing {
        singleVariant('release')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        minSdk 24
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES']
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError false
    }
}

afterEvaluate {

    task androidJavadocs(type: Javadoc) {
        source = android.sourceSets.getByName('main').java.srcDirs
        source += android.sourceSets.getByName('main').kotlin.srcDirs
        classpath = configurations.releaseCompileClasspath.incoming.artifactView {
            attributes {
                attribute(Attribute.of('artifactType', String), 'jar')
            }
        }.files
        classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    }

    task androidJavadocsJar(type: Jar, dependsOn: androidJavadocs) {
        archiveClassifier.set('javadoc')
        from androidJavadocs.destinationDir
    }

    task androidSourcesJar(type: Jar) {
        archiveClassifier.set('sources')
        from android.sourceSets.getByName('main').java.srcDirs
        from android.sourceSets.getByName('main').kotlin.srcDirs
    }

    // ✅ publishing block is separate from android block — NOT nested inside it
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.release

                groupId = project.group
                artifactId = POM_ARTIFACT_ID
                version = project.version

                artifact androidSourcesJar
                artifact androidJavadocsJar

                pom {
                    name = POM_NAME
                    description = POM_DESCRIPTION
                    url = POM_URL
                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                            distribution = POM_LICENCE_DIST
                        }
                    }
                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                            email = 'open-source@bazaarvoice.com'
                            organization = 'Bazaarvoice, Inc.'
                            organizationUrl = 'https://www.bazaarvoice.com'
                        }
                    }
                    scm {
                        url = POM_SCM_URL
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                    }
                }
            }
        }
    }

    // ✅ signing is also separate, outside of publishing block
    signing {
        sign publishing.publications.mavenJava
    }

    tasks.withType(Javadoc) {
        options {
            encoding "UTF-8"
            charSet 'UTF-8'
            author true
            failOnError false
            version true
            links "https://developer.android.google.cn/reference/"
        }
    }

    if (JavaVersion.current().isJava8Compatible()) {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
    if (JavaVersion.current().isJava9Compatible()) {
        tasks.withType(Javadoc) {
            options.addBooleanOption('html5', true)
        }
    }

} // End of afterEvaluate
